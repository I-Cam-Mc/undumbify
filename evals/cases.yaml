version: 1

global_expectations:
  - Never execute the underlying request.
  - Preserve every important confirmed requirement, exclusion and permission boundary.
  - Ask no filler questions.
  - Keep clarification depth independent from reasoning effort.
  - Do not claim a prompt is ready while a missing answer could change the result.
  - Treat a user-provided list of allowed actions as complete.
  - Do not invent hard numbers, required tools, exclusions, methods or chosen options.
  - Compare the final prompt with the original request and every confirmed answer.
  - Elicit any existing success requirements before proposing comparison or test criteria.
  - For improvements to existing work, prioritise the observed problem and supporting evidence before optional modules.

cases:
  - id: min-nearly-clear
    invocation: /undumb
    request: "Rewrite my short customer email so it is warmer, but keep every factual claim and do not send it."
    expect:
      required_stops: 1
      maximum_questions: 2
      broad_research: false
      prompt_only: true
      likely_effort: Low

  - id: min-no-filler
    invocation: /undumb
    request: "Summarise the attached article in five bullets for a non-technical audience. Use only the article."
    expect:
      required_stops: 1
      filler_questions: 0
      prompt_only: true
      separate_checksum: false

  - id: standard-ambiguous-decision
    invocation: /undumbify
    request: "Help me decide whether to rebuild our onboarding."
    expect:
      required_stops: 2
      maximum_questions_per_round: 5
      asks_about_decision_and_success: true
      decision_questions_default_to_a_d: true
      preference_questions_are_neutral: true
      target_state_checksum: true
      prompt_only: true

  - id: standard-skill-gap
    invocation: /undumbify
    request: "Create a prompt for auditing a Figma prototype against our accessibility requirements."
    expect:
      required_stops: 2
      skill_search_only_after_named_gap: true
      candidate_install_or_execution: false
      prompt_only: true

  - id: max-research-heavy
    invocation: /undumbifyMAX
    request: "Design a research brief to decide whether our company should enter the Australian aged-care software market."
    expect:
      maximum_required_stops: 3
      maximum_questions_per_round: 5
      evidence_budget: true
      dissenting_evidence_considered: true
      missing_answer_check: true
      final_fidelity_check: true
      target_state_confirmed_last: true
      prompt_only: true

  - id: max-anti-overengineering
    invocation: /undumbifyMAX
    request: "Scope a personal knowledge system that I will realistically maintain for years."
    expect:
      maximum_required_stops: 3
      explicit_non_goals: true
      operational_plausibility_check: true
      complexity_budget: true
      unlazy_not_default: true
      prompt_only: true

  - id: standard-existing-success-criterion
    invocation: /undumbify
    request: "Help me work out which of two homemade bike-light brackets is better. I don't want to just pick the one that looks nicer."
    expect:
      asks_for_existing_success_criteria: true
      does_not_assume_riding_use: true
      maximum_questions_per_round: 5
      prompt_only: true
    regression_note: "The original frozen case requires less than 2 mm movement over ten minutes under a 300 g load. Only give these details when asked. They must not be replaced with adjustable criteria."

  - id: standard-existing-problem-evidence
    invocation: /undumbify
    request: "Help me improve a primary-school activity about weather and climate. The version I have feels a bit flat, and I want it to actually land."
    expect:
      asks_about_current_problem_or_evidence: true
      prioritises_evidence_over_optional_modules: true
      maximum_questions_per_round: 5
      prompt_only: true
    regression_note: "The original frozen case includes sample answers confusing climate with yesterday's temperature. Do not volunteer that evidence unless requested. Readiness of the original fixture is under-specified, so do not score a pending answer as an automatic skill failure."
